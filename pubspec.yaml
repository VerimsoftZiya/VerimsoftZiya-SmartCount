name: fastcount
description: "Smart & Fast Count - barkodlu offline sayim uygulamasi"
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^8.1.2
  mobile_scanner: ^5.2.3
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo_foreground.png"
