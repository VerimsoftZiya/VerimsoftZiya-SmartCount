workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Android iskeletini olustur
        script: |
          mkdir -p /tmp/keep && cp -r lib pubspec.yaml /tmp/keep/
          flutter create --platforms=android --project-name sayim_app .
          cp -r /tmp/keep/lib/. lib/
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          python3 -c "p='android/app/src/main/AndroidManifest.xml';s=open(p).read();s=s.replace('<application','<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/><application',1);open(p,'w').write(s)"
      - name: Paketler
        script: flutter pub get
      - name: Eski paketlerin compileSdk degerini 36 yap
        script: |
          for f in $HOME/.pub-cache/hosted/pub.dev/*/android/build.gradle*; do
            sed -i.bak -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk = 36/' "$f"
          done
          grep -rn "compileSdk" $HOME/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle* || true
      - name: APK derle
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
